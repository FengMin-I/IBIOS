<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon section (64x64 centered in 80x80 area) -->
  <g transform="translate(8, 8)">
    <!-- Connection lines -->
    <line x1="32" y1="12" x2="16" y2="48" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="48" y2="48" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="48" x2="48" y2="48" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Central ring -->
    <circle cx="32" cy="32" r="8" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4"/>

    <!-- Nodes -->
    <circle cx="32" cy="12" r="8" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="16" cy="48" r="8" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="48" cy="48" r="8" fill="url(#nodeGrad)" filter="url(#glow)"/>

    <!-- Inner dots -->
    <circle cx="32" cy="12" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="16" cy="48" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="48" cy="48" r="2.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Text section -->
  <text x="88" y="42" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="2">IBIOS</text>
  <text x="88" y="62" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6b7280" letter-spacing="1">Enterprise Agent OS</text>
</svg>
